name: DNS target refresh patch

on:
  push:
    branches:
      - dns-target-refresh-r66-run

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean commits
        shell: bash
        run: |
          set -eu
          cp .github/patch-dns-target-refresh.py /tmp/patch-dns-target-refresh.py
          sed -i 's/re.subn(pattern, replacement, text, count=1, flags=re.S)/re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)/' /tmp/patch-dns-target-refresh.py
          git fetch origin master
          git checkout -B dns-target-refresh-r66 origin/master
          git config user.name "IvonWei"
          git config user.email "madwind.cn@gmail.com"
          python3 /tmp/patch-dns-target-refresh.py
          git diff --check
          git add root/usr/libexec/wloc/firewall.uc root/usr/libexec/wloc/rules.uc src/wloc-rs/src/main.rs src/wloc-rs/src/resolver.rs
          git commit -m 'Refresh location targets only when DNS changes'
          sed -i 's/^WLOC_RELEASE=65$/WLOC_RELEASE=66/' version.env
          git diff --check
          git add version.env
          git commit -m 'Bump WLOC release to r66'
          git push --force origin HEAD:dns-target-refresh-r66
