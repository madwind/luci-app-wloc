name: WLOC / OpenWrt upstream maintenance

run-name: Upstream check / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openwrt-upstream
  cancel-in-progress: true

jobs:
  check-release:
    name: Check OpenWrt release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare with OpenWrt Git tags
        id: versions
        shell: bash
        run: bash ./scripts/check-openwrt-upstream.sh

      - name: Open an upgrade issue
        if: steps.versions.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          title="OpenWrt upstream update: ${CURRENT} -> ${LATEST}"
          existing="$(gh issue list \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if test -n "$existing"; then
            echo "Issue #${existing} already tracks this update."
            exit 0
          fi

          gh issue create --title "$title" --body-file - <<EOF
          OpenWrt published Git tag [v${LATEST}](https://github.com/openwrt/openwrt/tree/v${LATEST}); this project currently builds against v${CURRENT}.

          Upgrade checklist:

          - update and verify the official SDK filenames for mediatek/filogic, rockchip/armv8, and x86/64;
          - update all three pinned SDK SHA-256 values;
          - confirm the GCC, musl, Rust target, ELF interpreter, and APK metadata for each target/subtarget; NanoPi R28S/FriendlyWrt is only a rockchip/armv8 compatibility example, not a separate SDK target;
          - update the versioned build script and README;
          - run the host tests and a full SDK package build.

          This issue was opened automatically from OpenWrt's Git tags.
          EOF
