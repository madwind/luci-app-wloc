name: Release

run-name: Release · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve package and release versions
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main" >&2
            exit 1
          fi

          read_version() {
            sed -n 's/^PKG_VERSION[[:space:]]*:=[[:space:]]*//p' | head -n1
          }
          read_release() {
            sed -n 's/^PKG_RELEASE[[:space:]]*:=[[:space:]]*//p' | head -n1
          }

          package_version="$(read_version < Makefile)"
          package_release="$(read_release < Makefile)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$package_release" =~ ^[0-9]+$ ]]; then
            echo "Invalid PKG_VERSION or PKG_RELEASE in Makefile: ${package_version:-unset}-r${package_release:-unset}" >&2
            exit 1
          fi

          publish=true
          if [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            previous_makefile="$(git show "$BEFORE_SHA:Makefile" 2>/dev/null || true)"
            if [[ -n "$previous_makefile" ]]; then
              previous_version="$(read_version <<<"$previous_makefile")"
              previous_release="$(read_release <<<"$previous_makefile")"
              if [[ "$package_version" == "$previous_version" && "$package_release" == "$previous_release" ]]; then
                publish=false
              fi
            fi
          fi

          version="${package_version}-r${package_release}"
          tag="v${version}"

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$publish" == "false" ]]; then
            echo "PKG_VERSION and PKG_RELEASE are unchanged; skipping release."
          fi

  build:
    name: Build · ${{ matrix.target }}/${{ matrix.subtarget }}
    needs: release-metadata
    if: needs.release-metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rockchip
            subtarget: armv8
            apk_arch: aarch64_generic
            sdk_sha256: 59194a023968398af64bfa7d8bc3eac322641f6dc9cdbade28a4d9dd41866eba
            elf_machine: AArch64
            elf_interpreter: /lib/ld-musl-aarch64.so.1
    env:
      OPENWRT_VERSION: "25.12.5"
      OPENWRT_TARGET: ${{ matrix.target }}
      OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
      SDK_PREP_REV: "2"
      SDK_ARCHIVE: openwrt-sdk-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIRECTORY: openwrt-sdk-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-14.3.0_musl.Linux-x86_64
      SDK_CACHE_ROOT: ${{ github.workspace }}/.build/openwrt-25.12.5/${{ matrix.target }}/${{ matrix.subtarget }}
      OPENWRT_SDK: ${{ github.workspace }}/.build/openwrt-25.12.5/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-14.3.0_musl.Linux-x86_64
      WLOC_APK_ARCH: ${{ matrix.apk_arch }}
      WLOC_ELF_MACHINE: ${{ matrix.elf_machine }}
      WLOC_ELF_INTERPRETER: ${{ matrix.elf_interpreter }}
      RUST_TOOLCHAIN: "1.89.0"
      RUSTUP_TOOLCHAIN: "1.89.0"
      RUST_TARGET: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore prepared OpenWrt SDK
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: openwrt-sdk-${{ runner.os }}-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.sdk_sha256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${SDK_ARCHIVE}"
          sdk_file="$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir -p "$SDK_CACHE_ROOT"
          curl --fail --location --retry 5 --retry-all-errors --show-error \
            --output "$sdk_file" "$sdk_url"
          printf '%s  %s\n' '${{ matrix.sdk_sha256 }}' "$sdk_file" | sha256sum --check --strict
          tar --extract --zstd --file "$sdk_file" --directory "$SDK_CACHE_ROOT"

      - name: Verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$OPENWRT_SDK"
          test -x "$OPENWRT_SDK/scripts/feeds"
          test -x "$OPENWRT_SDK/staging_dir/host/bin/apk"
          test -x "$OPENWRT_SDK/staging_dir/host/bin/fakeroot"

      - name: Prepare OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$OPENWRT_SDK/scripts/feeds" update luci
          "$OPENWRT_SDK/scripts/feeds" install luci-base
          test -f "$OPENWRT_SDK/feeds/luci/luci.mk"
          touch "$OPENWRT_SDK/.config"
          mkdir -p "$OPENWRT_SDK/staging_dir/host"
          touch "$OPENWRT_SDK/staging_dir/host/.prereq-build"
          FORCE=1 make -C "$OPENWRT_SDK" defconfig
          find "$OPENWRT_SDK/feeds" -mindepth 2 -maxdepth 2 -type d -name .git -prune -exec rm -rf -- {} +

      - name: Save prepared OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: openwrt-sdk-${{ runner.os }}-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.sdk_sha256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Prepare native Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$RUST_TARGET"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/wloc-rs/target
          key: wloc-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGET }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}-${{ hashFiles('src/wloc-rs/Cargo.toml', 'src/wloc-rs/src/**/*.rs') }}
          restore-keys: |
            wloc-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGET }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}-
            wloc-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGET }}-

      - name: Fetch Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path src/wloc-rs/Cargo.toml

      - name: Build ${{ matrix.target }}/${{ matrix.subtarget }} APK
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-apk.sh
          bash ./scripts/build-apk.sh

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/wloc-rs/target
          key: wloc-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGET }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}-${{ hashFiles('src/wloc-rs/Cargo.toml', 'src/wloc-rs/src/**/*.rs') }}

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="$(find "dist/${{ matrix.target }}/${{ matrix.subtarget }}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release-assets
          asset="luci-app-wloc-${RELEASE_VERSION}-${{ matrix.apk_arch }}.apk"
          cp "$source_apk" "release-assets/$asset"

      - name: Upload ${{ matrix.target }}/${{ matrix.subtarget }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wloc-${{ matrix.target }}-${{ matrix.subtarget }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - release-metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wloc-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.apk \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
