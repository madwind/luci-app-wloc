name: Release

run-name: Release · ${{ github.ref_name }}

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - version.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · ${{ matrix.target }}/${{ matrix.subtarget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mediatek
            subtarget: filogic
            apk_arch: aarch64_cortex-a53
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
            rust_target: aarch64-unknown-linux-musl
            elf_machine: AArch64
            elf_interpreter: /lib/ld-musl-aarch64.so.1
          - target: rockchip
            subtarget: armv8
            apk_arch: aarch64_generic
            sdk_sha256: 59194a023968398af64bfa7d8bc3eac322641f6dc9cdbade28a4d9dd41866eba
            rust_target: aarch64-unknown-linux-musl
            elf_machine: AArch64
            elf_interpreter: /lib/ld-musl-aarch64.so.1
          - target: x86
            subtarget: "64"
            apk_arch: x86_64
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
            rust_target: x86_64-unknown-linux-musl
            elf_machine: X86-64
            elf_interpreter: /lib/ld-musl-x86_64.so.1
    env:
      OPENWRT_VERSION: "25.12.5"
      OPENWRT_TARGET: ${{ matrix.target }}
      OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
      RUST_TOOLCHAIN: "1.89.0"
      RUSTUP_TOOLCHAIN: "1.89.0"
      SDK_PREP_REV: "1"
      SDK_ARCHIVE: openwrt-sdk-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIRECTORY: openwrt-sdk-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-14.3.0_musl.Linux-x86_64
      SDK_CACHE_ROOT: ${{ github.workspace }}/.build/openwrt-25.12.5/${{ matrix.target }}/${{ matrix.subtarget }}
      OPENWRT_SDK: ${{ github.workspace }}/.build/openwrt-25.12.5/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-14.3.0_musl.Linux-x86_64
      WLOC_APK_ARCH: ${{ matrix.apk_arch }}
      WLOC_ELF_MACHINE: ${{ matrix.elf_machine }}
      WLOC_ELF_INTERPRETER: ${{ matrix.elf_interpreter }}

    steps:
      - uses: actions/checkout@v7

      - name: Restore prepared OpenWrt SDK
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: openwrt-sdk-${{ runner.os }}-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.sdk_sha256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${SDK_ARCHIVE}"
          sdk_file="$RUNNER_TEMP/$SDK_ARCHIVE"
          mkdir -p "$SDK_CACHE_ROOT"
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --output "$sdk_file" \
            "$sdk_url"
          printf '%s  %s\n' '${{ matrix.sdk_sha256 }}' "$sdk_file" | sha256sum --check --strict
          tar --extract --zstd --file "$sdk_file" --directory "$SDK_CACHE_ROOT"

      - name: Verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$OPENWRT_SDK"
          test -x "$OPENWRT_SDK/scripts/feeds"
          test -x "$OPENWRT_SDK/staging_dir/host/bin/apk"
          test -x "$OPENWRT_SDK/staging_dir/host/bin/fakeroot"

      - name: Prepare OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$OPENWRT_SDK/scripts/feeds" update luci
          "$OPENWRT_SDK/scripts/feeds" install luci-base
          test -f "$OPENWRT_SDK/feeds/luci/luci.mk"
          touch "$OPENWRT_SDK/.config"
          mkdir -p "$OPENWRT_SDK/staging_dir/host"
          touch "$OPENWRT_SDK/staging_dir/host/.prereq-build"
          FORCE=1 make -C "$OPENWRT_SDK" defconfig
          find "$OPENWRT_SDK/feeds" -mindepth 2 -maxdepth 2 -type d -name .git -prune -exec rm -rf -- {} +

      - name: Save prepared OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SDK_CACHE_ROOT }}
          key: openwrt-sdk-${{ runner.os }}-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.sdk_sha256 }}-prepared-v${{ env.SDK_PREP_REV }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" '${{ matrix.rust_target }}'
          cargo fetch --locked --manifest-path src/wloc-rs/Cargo.toml

      - name: Build ${{ matrix.target }}/${{ matrix.subtarget }} APK
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-apk.sh
          bash ./scripts/build-apk.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match version.env ($expected_tag)." >&2
              exit 1
            fi
          fi
          source_apk="$(find "dist/${{ matrix.target }}/${{ matrix.subtarget }}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release-assets
          asset="luci-app-wloc-${WLOC_VERSION}-r${WLOC_RELEASE}-${{ matrix.apk_arch }}.apk"
          cp "$source_apk" "release-assets/$asset"

      - name: Upload ${{ matrix.target }}/${{ matrix.subtarget }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wloc-${{ matrix.target }}-${{ matrix.subtarget }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wloc-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          release_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/*.apk --clobber
          else
            gh release create "$release_tag" release-assets/*.apk \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$release_tag"
          fi
