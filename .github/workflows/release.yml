name: Release

run-name: Release · ${{ github.ref_name }}

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - version.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · ${{ matrix.target }}/${{ matrix.subtarget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mediatek
            subtarget: filogic
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
          - target: rockchip
            subtarget: armv8
            sdk_sha256: 59194a023968398af64bfa7d8bc3eac322641f6dc9cdbade28a4d9dd41866eba
          - target: x86
            subtarget: "64"
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c

    steps:
      - uses: actions/checkout@v7

      - name: Cache verified OpenWrt SDK downloads
        uses: actions/cache@v6
        with:
          path: .build/openwrt-25.12.5/${{ matrix.target }}/${{ matrix.subtarget }}/downloads
          key: openwrt-sdk-${{ runner.os }}-25.12.5-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.sdk_sha256 }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-

      - name: Build ${{ matrix.target }}/${{ matrix.subtarget }} APK
        shell: bash
        run: bash ./scripts/build-openwrt-25.12.5.sh "${{ matrix.target }}/${{ matrix.subtarget }}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match version.env ($expected_tag)." >&2
              exit 1
            fi
          fi
          source_apk="$(find "dist/${{ matrix.target }}/${{ matrix.subtarget }}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release-assets
          TARGET_SUFFIX="${{ matrix.target }}-${{ matrix.subtarget }}"
          asset="luci-app-wloc-${WLOC_VERSION}-r${WLOC_RELEASE}-${TARGET_SUFFIX}.apk"
          cp "$source_apk" "release-assets/$asset"
          (cd release-assets && sha256sum "$asset" >"$asset.sha256")

      - name: Upload ${{ matrix.target }}/${{ matrix.subtarget }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wloc-${{ matrix.target }}-${{ matrix.subtarget }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wloc-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          release_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$release_tag"
          fi
