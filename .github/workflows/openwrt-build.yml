name: WLOC / OpenWrt package build

run-name: OpenWrt packages / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: filogic
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
          - target: x86_64
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c

    steps:
      - uses: actions/checkout@v7

      - name: Cache verified OpenWrt SDK downloads
        uses: actions/cache@v6
        with:
          path: .build/openwrt-25.12.5-${{ matrix.target }}/downloads
          key: openwrt-sdk-${{ runner.os }}-25.12.5-${{ matrix.target }}-${{ matrix.sdk_sha256 }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-

      - name: Build ${{ matrix.target }} APK
        shell: bash
        run: bash ./scripts/build-openwrt-25.12.5.sh "${{ matrix.target }}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          source_apk="$(find "dist/${{ matrix.target }}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release-assets
          asset="luci-app-wloc-${WLOC_VERSION}-r${WLOC_RELEASE}-${{ matrix.target }}.apk"
          cp "$source_apk" "release-assets/$asset"
          (cd release-assets && sha256sum "$asset" >"$asset.sha256")

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-wloc-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: luci-app-wloc-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            . ./version.env
            release_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$release_tag"
          fi
