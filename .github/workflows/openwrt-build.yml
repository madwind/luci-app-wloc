name: WLOC / release packages

run-name: Release packages / ${{ github.ref_name }}

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - version.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build APK / ${{ matrix.target }}
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: filogic
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
          - target: x86_64
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c

    steps:
      - uses: actions/checkout@v7

      - name: Cache verified OpenWrt SDK downloads
        uses: actions/cache@v6
        with:
          path: .build/openwrt-25.12.5-${{ matrix.target }}/downloads
          key: openwrt-sdk-${{ runner.os }}-25.12.5-${{ matrix.target }}-${{ matrix.sdk_sha256 }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-

      - name: Build ${{ matrix.target }} APK
        shell: bash
        run: bash ./scripts/build-openwrt-25.12.5.sh "${{ matrix.target }}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match version.env ($expected_tag)." >&2
              exit 1
            fi
          fi
          source_apk="$(find "dist/${{ matrix.target }}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release-assets
          asset="luci-app-wloc-${WLOC_VERSION}-r${WLOC_RELEASE}-${{ matrix.target }}.apk"
          cp "$source_apk" "release-assets/$asset"
          (cd release-assets && sha256sum "$asset" >"$asset.sha256")

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-wloc-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  openwrt-lifecycle:
    name: OpenWrt x86_64 lifecycle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Download x86_64 APK
        uses: actions/download-artifact@v8
        with:
          name: luci-app-wloc-x86_64
          path: runtime-assets

      - name: Install QEMU and image tooling
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Cache verified OpenWrt lifecycle image
        uses: actions/cache@v6
        with:
          path: .build/openwrt-lifecycle/downloads
          key: openwrt-lifecycle-image-${{ runner.os }}-25.12.5-23e2538e8ab0eb52dfed1c65d608ecdb71ffd432dd54885da138ae67cd9e4461

      - name: Prepare OpenWrt image and SSH key
        shell: bash
        run: |
          set -euo pipefail
          image_dir="$GITHUB_WORKSPACE/.build/openwrt-lifecycle/downloads"
          image_gz="$image_dir/openwrt-25.12.5-x86-64-generic-ext4-combined.img.gz"
          image="$RUNNER_TEMP/openwrt-25.12.5-x86-64-generic-ext4-combined.img"
          mkdir -p "$image_dir"
          if [[ ! -f "$image_gz" ]]; then
            curl --fail --location --retry 3 --output "$image_gz.part" \
              "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-generic-ext4-combined.img.gz"
            mv "$image_gz.part" "$image_gz"
          fi
          printf '%s  %s\n' \
            '23e2538e8ab0eb52dfed1c65d608ecdb71ffd432dd54885da138ae67cd9e4461' \
            "$image_gz" | sha256sum --check --status
          gzip -dc "$image_gz" > "$image"
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/wloc-lifecycle"
          network_config="$RUNNER_TEMP/wloc-network"
          printf '%s\n' \
            "config interface 'loopback'" \
            "        option device 'lo'" \
            "        option proto 'static'" \
            "        option ipaddr '127.0.0.1'" \
            "        option netmask '255.0.0.0'" \
            '' \
            "config interface 'lan'" \
            "        option device 'eth0'" \
            "        option proto 'static'" \
            "        option ipaddr '192.168.1.1'" \
            "        option netmask '255.255.255.0'" \
            "        option gateway '192.168.1.2'" \
            "        list dns '192.168.1.3'" > "$network_config"
          loopdev=''
          mount_dir=''
          cleanup() {
            if [[ -n "$mount_dir" ]]; then
              sudo umount "$mount_dir" 2>/dev/null || true
            fi
            if [[ -n "$loopdev" ]]; then
              sudo losetup -d "$loopdev" 2>/dev/null || true
            fi
            if [[ -n "$mount_dir" ]]; then
              rmdir "$mount_dir" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          loopdev="$(sudo losetup --find --show --partscan "$image")"
          mount_dir="$(mktemp -d)"
          root_partition="$(sudo lsblk -lnpo NAME,FSTYPE "$loopdev" | awk '$2 == "ext4" { print $1; exit }')"
          test -n "$root_partition"
          sudo mount "$root_partition" "$mount_dir"
          sudo cp "$network_config" "$mount_dir/etc/config/network"
          sudo mkdir -p "$mount_dir/etc/dropbear"
          sudo cp "$RUNNER_TEMP/wloc-lifecycle.pub" \
            "$mount_dir/etc/dropbear/authorized_keys"
          sudo chmod 0600 "$mount_dir/etc/dropbear/authorized_keys"
          sudo chown 0:0 "$mount_dir/etc/dropbear/authorized_keys"
          sync

      - name: Run OpenWrt lifecycle test
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find runtime-assets -maxdepth 2 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          WLOC_OPENWRT_IMAGE="$RUNNER_TEMP/openwrt-25.12.5-x86-64-generic-ext4-combined.img" \
          WLOC_OPENWRT_APK="$GITHUB_WORKSPACE/$apk" \
          WLOC_OPENWRT_SSH_KEY="$RUNNER_TEMP/wloc-lifecycle" \
          WLOC_OPENWRT_MEMORY=256M \
          sh ./tests/openwrt-lifecycle.test.sh

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    needs: [host-tests, build, openwrt-lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: luci-app-wloc-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          release_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$release_tag"
          fi
