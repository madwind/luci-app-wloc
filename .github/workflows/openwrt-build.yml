name: WLOC / release packages

run-name: Release packages / ${{ github.ref_name }}

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - version.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build APK / ${{ matrix.target }}
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: filogic
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
          - target: x86_64
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c

    steps:
      - uses: actions/checkout@v7

      - name: Cache verified OpenWrt SDK downloads
        uses: actions/cache@v6
        with:
          path: .build/openwrt-25.12.5-${{ matrix.target }}/downloads
          key: openwrt-sdk-${{ runner.os }}-25.12.5-${{ matrix.target }}-${{ matrix.sdk_sha256 }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-

      - name: Build ${{ matrix.target }} APK
        shell: bash
        run: bash ./scripts/build-openwrt-25.12.5.sh "${{ matrix.target }}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match version.env ($expected_tag)." >&2
              exit 1
            fi
          fi
          source_apk="$(find "dist/${{ matrix.target }}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release-assets
          asset="luci-app-wloc-${WLOC_VERSION}-r${WLOC_RELEASE}-${{ matrix.target }}.apk"
          cp "$source_apk" "release-assets/$asset"
          (cd release-assets && sha256sum "$asset" >"$asset.sha256")

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-wloc-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  openwrt-lifecycle:
    name: OpenWrt x86_64 lifecycle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Download x86_64 APK
        uses: actions/download-artifact@v8
        with:
          name: luci-app-wloc-x86_64
          path: runtime-assets

      - name: Install QEMU and ImageBuilder tooling
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 rsync zstd

      - name: Cache verified OpenWrt ImageBuilder downloads
        uses: actions/cache@v6
        with:
          path: .build/openwrt-lifecycle/downloads
          key: openwrt-imagebuilder-${{ runner.os }}-25.12.5-313221253d9bac534e4a4ee6492a4941b4ba0f43200eceb8d16a4785470ae9df

      - name: Build OpenWrt lifecycle image with ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          image_dir="$GITHUB_WORKSPACE/.build/openwrt-lifecycle/downloads"
          imagebuilder_archive="$image_dir/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst"
          imagebuilder_dir="$RUNNER_TEMP/openwrt-imagebuilder"
          image="$RUNNER_TEMP/openwrt-25.12.5-x86-64-generic-ext4-combined.img"
          overlay_dir="$GITHUB_WORKSPACE/tests/openwrt-image-overlay"
          mkdir -p "$image_dir"
          if [[ ! -f "$imagebuilder_archive" ]]; then
            curl --fail --location --retry 3 --output "$imagebuilder_archive.part" \
              "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst"
            mv "$imagebuilder_archive.part" "$imagebuilder_archive"
          fi
          printf '%s  %s\n' \
            '313221253d9bac534e4a4ee6492a4941b4ba0f43200eceb8d16a4785470ae9df' \
            "$imagebuilder_archive" | sha256sum --check --status

          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/wloc-lifecycle"
          rm -rf "$overlay_dir"
          mkdir -p "$overlay_dir/etc/config" "$overlay_dir/etc/dropbear"
          printf '%s\n' \
            "config interface 'loopback'" \
            "        option device 'lo'" \
            "        option proto 'static'" \
            "        option ipaddr '127.0.0.1'" \
            "        option netmask '255.0.0.0'" \
            '' \
            "config interface 'lan'" \
            "        option device 'eth0'" \
            "        option proto 'static'" \
            "        option ipaddr '192.168.1.1'" \
            "        option netmask '255.255.255.0'" \
            "        option gateway '192.168.1.2'" \
            "        list dns '192.168.1.3'" > "$overlay_dir/etc/config/network"
          install -m 0600 "$RUNNER_TEMP/wloc-lifecycle.pub" \
            "$overlay_dir/etc/dropbear/authorized_keys"

          rm -rf "$imagebuilder_dir"
          mkdir -p "$imagebuilder_dir"
          tar --zstd --extract --strip-components=1 \
            --file "$imagebuilder_archive" --directory "$imagebuilder_dir"
          make -C "$imagebuilder_dir" image PROFILE='generic' FILES="$overlay_dir"
          image_gz="$imagebuilder_dir/bin/targets/x86/64/openwrt-25.12.5-x86-64-generic-ext4-combined.img.gz"
          test -f "$image_gz"
          gzip -dc "$image_gz" >"$image"

      - name: Run OpenWrt lifecycle test
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find runtime-assets -maxdepth 2 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          WLOC_OPENWRT_IMAGE="$RUNNER_TEMP/openwrt-25.12.5-x86-64-generic-ext4-combined.img" \
          WLOC_OPENWRT_APK="$GITHUB_WORKSPACE/$apk" \
          WLOC_OPENWRT_SSH_KEY="$RUNNER_TEMP/wloc-lifecycle" \
          WLOC_OPENWRT_MEMORY=256M \
          sh ./tests/openwrt-lifecycle.test.sh

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    needs: [host-tests, build, openwrt-lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: luci-app-wloc-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          . ./version.env
          release_tag="v${WLOC_VERSION}-r${WLOC_RELEASE}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$release_tag"
          fi
