name: Firewall set placeholders clean

on:
  push:
    branches:
      - firewall-set-placeholders-r65c

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clean patch
        shell: bash
        run: |
          set -eu
          cp .github/patch-firewall-sets.py /tmp/patch-firewall-sets.py
          git fetch origin master
          git checkout -B firewall-set-placeholders-r65c origin/master
          python3 /tmp/patch-firewall-sets.py
          git diff --check
          git add root/usr/libexec/wloc/firewall.uc root/usr/libexec/wloc/rules.uc
          git commit -m 'Render dynamic sets from firewall placeholders'
          sed -i 's/^WLOC_RELEASE=64$/WLOC_RELEASE=65/' version.env
          git diff --check
          git add version.env
          git commit -m 'Bump WLOC release to r65'
          git push --force origin HEAD:firewall-set-placeholders-r65c
