name: OpenWrt Smoke

run-name: x86_64 · ${{ github.ref_name }}

on:
  push:
    branches:
      - master
    paths:
      - Makefile
      - src/**
      - root/**
      - scripts/build-openwrt-*.sh

  pull_request:
    branches:
      - master
    paths:
      - Makefile
      - src/**
      - root/**
      - scripts/build-openwrt-*.sh

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-sdk:
    name: x86_64 SDK compile smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Cache verified OpenWrt SDK downloads
        uses: actions/cache@v6
        with:
          path: .build/openwrt-25.12.5/x86/64/downloads
          key: openwrt-sdk-${{ runner.os }}-25.12.5-x86-64-0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('src/wloc-rs/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-

      - name: Build x86/64 APK
        shell: bash
        run: bash ./scripts/build-openwrt-25.12.5.sh x86/64
