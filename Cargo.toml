[package]
name = "wloc-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/smthdagg/luci-app-wloc"
publish = false

[[bin]]
name = "wlocd"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
bytes = "=1.10.1"
h2 = "=0.4.12"
http = "=1.3.1"
libc = "=0.2.189"
rcgen = { version = "=0.14.3", default-features = false, features = ["ring"] }
ring = "=0.17.14"
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
socket2 = { version = "=0.6.5", features = ["all"] }
time = { version = "=0.3.41", features = ["std"] }
tokio = { version = "=1.47.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
