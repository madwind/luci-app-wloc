[package]
name = "wloc-rs"
# The installable package version lives in version.env. This crate is private.
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/madwind/luci-app-wloc"
publish = false

[[bin]]
name = "wlocd"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
bytes = "=1.12.1"
h2 = "=0.4.19"
http = "=1.5.0"
libc = "=0.2.189"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
ring = "=0.17.14"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = { version = "=0.6.5", features = ["all"] }
time = { version = "=0.3.55", features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
